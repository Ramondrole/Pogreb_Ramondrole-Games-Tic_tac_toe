<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramondrole: Крестики-нолики</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>ⓍⓄ</text></svg>">
</head>
<body>
    <div class="cyber-grid"></div>
    
    
    <div class="top-bar">
        <a href="https://ramondrole.github.io/Pogreb_Ramondrole/" class="logo" id="logo">Ramon<span>drole</span></a>
        <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" class="back-btn" id="back-btn"> Назад</a>
    </div>
    
    <div class="container">
        <header>
            <h1 class="glitch">Ramondrole XO</h1>
            <p class="subtitle">НОВЫЕ КРЕСТИКИ-НОЛИКИ</p>
        </header>
        
        <div class="game-area">
            <div class="game-info">
                <div class="stats">
                    <div class="stat-item">
                        <span>СЛОЖНОСТЬ:</span>
                        <span class="stat-value">ЛЕГКО</span>
                    </div>
                    <div class="stat-item">
                        <span>РЕЖИМ:</span>
                        <span class="stat-value">2 ИГРОКА</span>
                    </div>
                    <div class="stat-item">
                        <span>СТАТУС:</span>
                        <span class="stat-value" id="status">ИГРАЕМ</span>
                    </div>
                </div>
                
                <div class="current-player">
                    <p>ТЕКУЩИЙ ИГРОК</p>
                    <div class="player-name" id="current-player-name">ИГРОК X</div>
                    <div class="player-symbol" id="current-player-symbol">X</div>
                </div>
                
                <div class="controls">
                    <button id="new-game-btn">
                        <i class="fas fa-gamepad"></i> НОВАЯ ИГРА
                    </button>
                    <button id="reset-score-btn" class="reset-btn">
                        <i class="fas fa-redo"></i> СБРОС СЧЕТА
                    </button>
                </div>
            </div>
            
            <div class="game-board">
                <div class="board" id="board">
                    
                </div>
                
                <div class="message" id="message">
                    СДЕЛАЙТЕ ПЕРВЫЙ ХОД!
                </div>
            </div>
        </div>
        
        <div class="score-board">
            <div class="score x">
                <div class="score-title">КРЕСТИКИ (X)</div>
                <div class="score-value" id="score-x">0</div>
            </div>
            <div class="score draw">
                <div class="score-title">НИЧЬИ</div>
                <div class="score-value" id="score-draw">0</div>
            </div>
            <div class="score o">
                <div class="score-title">НОЛИКИ (O)</div>
                <div class="score-value" id="score-o">0</div>
            </div>
        </div>
        
        <footer>
            <p>Ramondrole СЕТЬ 2077 | СИСТЕМА v2.0 | АДАПТИВНЫЙ ДИЗАЙН</p>
            <p style="margin-top: 10px; color: #ff00ff; font-size: 1.1rem;">RAMONDROLE CORPORATION © 2077</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
